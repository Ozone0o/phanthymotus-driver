mcp_port: 15702
name: "adam-fl"  # Agent Core registration/display name; driver id stays in driver.yaml.
ros_namespace: ""  # auto-detect from hostname

# Adam Pro exposes 31 body motors. Change to lite or sp for another model.
variant: "pro"

# The official high-level RobotControl service listens on the robot at :6666.
grpc_host: "localhost"
grpc_port: 6666

# The Adam DDS service on the reference board uses domain 0. Leave the
# interface empty to let CycloneDDS select the active robot interface.
dds_domain_id: 0
dds_network_interface: ""

plugins:
  state:
    enabled: true
    publish_rate_hz: 50
  robot_state:
    enabled: true
  switch_mode:
    enabled: true
  loco:
    enabled: true
  camera:
    enabled: true
    # The ZED Mini is connected to this Jetson. Keep the first version on the
    # local SDK path; the separate network streaming sender is not required.
    resolution: "VGA"
    fps: 15
    # PERFORMANCE avoids the first-run neural model optimization delay. Use
    # NEURAL_LIGHT only after its Jetson model cache has been prepared.
    depth_mode: "PERFORMANCE"
    # The head-mounted ZED Mini is installed upside down. Let the ZED SDK
    # rotate RGB, depth and point-cloud data consistently before publishing.
    camera_flip: true
    rgb_hz: 15
    depth_hz: 8
    info_hz: 1
    jpeg_quality: 70
    pointcloud:
      # The card remains discoverable, but point-cloud GPU/transport work is
      # opt-in. It can also be toggled with camera_pointcloud start/stop.
      enabled: false
      hz: 2
      max_points: 10000
      max_distance_m: 8.0
      # Fixed camera-mount compensation in the renderer frame, applied after
      # camera_flip.  The values below are calibrated from Adam's current
      # ZED-Mini installation; order is X, Y, Z and units are degrees.
      mount_rotation_deg:
        x: -14.2
        y: 0.0
        z: 0.8
      # Static translation in the renderer frame, applied after rotation.
      # +Y is up; 1.8 m places the floor at the renderer's Y=0 plane while
      # keeping the camera origin approximately 1.8 m above the floor.
      mount_translation_m:
        x: 0.0
        y: 1.8
        z: 0.0
  arm:
    enabled: true
    control_rate_hz: 400
  leg:
    enabled: true
  joint_effort:
    enabled: true
    control_rate_hz: 1000
  ankle_mode:
    enabled: true
  hand_state:
    enabled: true
    hand_type: "pnd"
    publish_rate_hz: 50
  hand:
    enabled: true
    # PND dexterous hand: 0 = fully open, 1000 = fully closed.
    hand_type: "pnd"
    control_rate_hz: 400
  model:
    enabled: true
