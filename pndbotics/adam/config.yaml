mcp_port: 15709
ros_namespace: ""   # 留空则自动使用 hostname；用于 ros_bridge.py 重发布的 /{ns}/state/* topic 命名
name: "PNDbotics Adam Pro"

# PNDbotics Adam 上层运控 gRPC 服务端（运行在 NUC 运动控制电脑的 adam_demo 内，端口 6666）
grpc_server: "10.10.20.127:6666"
grpc_timeout_sec: 2.0

# DDS 低层接口（rt/lowstate 状态 + rt/handstate/rt/handcmd 灵巧手）
dds:
  enabled: true
  domain_id: 1
  network_interface: "eno1"   # Jetson 有线网卡，跨机连 NUC 上的 pnd_adam_dds
  num_motor: 31
  stale_timeout_sec: 1.0

# state 插件轮询间隔（gRPC GetRobotState / GetStandList）
state:
  poll_interval_sec: 0.5

plugins:
  state:
    enabled: true
  dds_state:
    enabled: true
  hand:
    enabled: true
  loco:
    enabled: true
