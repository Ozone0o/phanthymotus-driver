syntax = "proto3";
package adam_control;

service RobotControl {
  rpc SetMode (SetModeRequest) returns (SetModeResponse);
  rpc SetStandMotion (SetStandMotionRequest) returns (SetStandMotionResponse);
  rpc SetStandCarryBox (SetCarryBoxRequest) returns (SetCarryBoxResponse);
  rpc SetStandAction (SetActionRequest) returns (SetActionResponse);
  rpc SetStandDynamic (SetDynamicStandRequest) returns (SetDynamicStandResponse);
  rpc SetSpeed (SetSpeedRequest) returns (SetSpeedResponse);
  rpc AutoUnigaitCOM (SetUnigaitCOMRequest) returns (SetUnigaitCOMResponse);
  rpc SetErrorClear (SetErrorClearRequest) returns (SetErrorClearResponse);
  rpc GetStandList (GetStandListRequest) returns (GetStandListResponse);
  rpc GetRobotState (GetRobotStateRequest) returns (GetRobotStateResponse);
  rpc CloseProgram (CloseProgramRequest) returns (CloseProgramResponse);
}

message SetModeRequest {
  string mode = 1;
}
message SetModeResponse {
  bool success = 1;
  string message = 2;
}

message SetStandMotionRequest {
  string motion = 1;
}
message SetStandMotionResponse {
  bool success = 1;
  string message = 2;
}

message SetCarryBoxRequest {
  string carry_box = 1;
}
message SetCarryBoxResponse {
  bool success = 1;
  string message = 2;
}

message SetActionRequest {
  double stand_pitch = 1;
  double stand_roll = 2;
  double stand_yaw = 3;
  double stand_height = 4;
}
message SetActionResponse {
  bool success = 1;
  string message = 2;
}

message SetDynamicStandRequest {
  bool dynamic_stand = 1;
}
message SetDynamicStandResponse {
  bool success = 1;
  string message = 2;
}

message SetSpeedRequest {
  double x_speed = 1;
  double y_speed = 2;
  double yaw_speed = 3;
  bool continous = 4;
}
message SetSpeedResponse {
  bool success = 1;
  string message = 2;
}

message SetUnigaitCOMRequest {
  bool unigait_mode_com_x = 1;
}
message SetUnigaitCOMResponse {
  bool success = 1;
  string message = 2;
}

message SetErrorClearRequest {
  bool error_clear_flag = 1;
}
message SetErrorClearResponse {
  bool success = 1;
  string message = 2;
}

message GetStandListRequest {
  bool mode_list_req = 1;
}
message GetStandListResponse {
  bool success = 1;
  string message = 2;
  repeated string mode_list = 3;
  repeated string motion_list = 4;
  repeated string action_list = 5;
  repeated string carrybox_list = 6;
  string balance_control = 7;
}

message GetRobotStateRequest {
  bool get_state_flag = 1;
}
message GetRobotStateResponse {
  bool success = 1;
  string message = 2;
  string fsm_name = 3;
  string current_motion = 4;
  repeated string current_action_list = 5;
  repeated string mode_enable_list = 6;
  repeated string motion_enable_list = 7;
  repeated string action_enable_list = 8;
  repeated string carrybox_enable_list = 9;
  string balance_control_enable = 10;
  double stand_pitch = 11;
  double stand_roll = 12;
  double stand_yaw = 13;
  double stand_height = 14;
  double x_vel = 15;
  double y_vel = 16;
  double yaw_vel = 17;
  bool balance_control_state = 18;
  bool motion_files_enable = 19;
}

message CloseProgramRequest {
  bool close_flag = 1;
}
message CloseProgramResponse {
  bool success = 1;
  string message = 2;
}
